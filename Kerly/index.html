<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Para ti ♡</title>

  <!-- Tipografías: Playfair Display (serif elegante) + Poppins (sans limpia) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       1. VARIABLES Y BASE
       ========================================================= */
    :root {
      --bg-1: #0b0a1f;          /* azul noche profundo */
      --bg-2: #1a1033;          /* violeta oscuro */
      --bg-3: #2a0f2e;          /* vino cálido */
      --text: #f6eef7;
      --muted: rgba(246, 238, 247, 0.62);
      --heart: #ff4d8d;
      --heart-glow: rgba(255, 77, 141, 0.55);
      --glass: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.16);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      overflow-x: hidden;               /* nunca scroll horizontal */
    }

    body {
      font-family: "Poppins", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 35%, rgba(255, 77, 141, 0.12), transparent 60%),
        radial-gradient(ellipse at 15% 90%, rgba(140, 90, 255, 0.14), transparent 55%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      background-color: var(--bg-1);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
    }

    /* Lienzo de partículas ambientales (detrás de todo) */
    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* =========================================================
       2. PANTALLA DE BIENVENIDA (corazón)
       ========================================================= */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 16px;
      transition: opacity 0.8s ease;
    }

    #intro.gone { opacity: 0; pointer-events: none; }

    .heart-btn {
      width: min(42vw, 170px);
      aspect-ratio: 1;
      border: none;
      background: none;
      cursor: pointer;
      outline: none;
      border-radius: 50%;
      animation: heartbeat 1.6s ease-in-out infinite;
      filter: drop-shadow(0 0 18px var(--heart-glow)) drop-shadow(0 0 42px rgba(255, 77, 141, 0.3));
      transition: transform 0.25s ease;
    }

    .heart-btn:focus-visible { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35); }
    .heart-btn svg { width: 100%; height: 100%; display: block; overflow: visible; }

    /* Latido doble, como un corazón real */
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%      { transform: scale(1.12); }
      28%      { transform: scale(1); }
      42%      { transform: scale(1.08); }
      70%      { transform: scale(1); }
    }

    /* Salida del corazón al hacer clic */
    .heart-btn.leaving {
      animation: heartLeave 0.75s cubic-bezier(.6, -0.3, .7, 1) forwards;
    }

    @keyframes heartLeave {
      0%   { transform: scale(1);    opacity: 1; }
      35%  { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.1);  opacity: 0; }
    }

    .hint {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: clamp(1rem, 3.8vw, 1.2rem);
      letter-spacing: 0.06em;
      color: var(--muted);
      animation: breathe 2.6s ease-in-out infinite;
      user-select: none;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.95; }
    }

    /* Chispas que salen del corazón al tocarlo */
    .spark {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      animation: spark 0.9s ease-out forwards;
    }

    @keyframes spark {
      from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      to   { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0); opacity: 0; }
    }

    /* =========================================================
       3. ESCENA DE LA FLOR
       ========================================================= */
    #scene {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: none;                      /* se activa tras el clic */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
      gap: 8px;
    }

    #scene.active { display: flex; }

    #flower {
      display: block;
      height: min(50vh, 440px);
      height: min(50svh, 440px);
      width: auto;
      max-width: 86vw;
      overflow: visible;
    }

    /* Tallo: se "dibuja" con stroke-dashoffset */
    .stem {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .bloom .stem { animation: draw 1.1s ease-out forwards; }

    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* Hojas, pétalos y centro comparten la misma mecánica:
       parten de escala 0 y crecen con un pequeño rebote. */
    .leaf, .petal, .core {
      transform-origin: 0 0;
      transform-box: view-box;
      opacity: 0;
      transform: rotate(var(--r, 0deg)) scale(0);
    }

    .bloom .leaf,
    .bloom .petal,
    .bloom .core {
      animation: grow var(--dur, 0.8s) cubic-bezier(.22, 1.2, .36, 1) var(--d, 0s) forwards;
    }

    @keyframes grow {
      0%   { opacity: 0; transform: rotate(var(--r, 0deg)) scale(0); }
      40%  { opacity: 1; }
      100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(var(--s, 1)); }
    }

    /* Una vez abierta, la flor "respira" suavemente */
    .head { transform-origin: 0 0; transform-box: view-box; }
    .alive .head { animation: sway 6s ease-in-out infinite; }

    @keyframes sway {
      0%, 100% { transform: rotate(-1.5deg) scale(1); }
      50%      { transform: rotate(1.5deg)  scale(1.025); }
    }

    /* =========================================================
       4. FRASE Y CONTADOR
       ========================================================= */
    #message {
      width: 100%;
      max-width: 720px;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(28px);
      transition: opacity 1.4s ease, transform 1.4s cubic-bezier(.2, .8, .2, 1), visibility 0s 1.4s;
    }

    #message.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity 1.4s ease, transform 1.4s cubic-bezier(.2, .8, .2, 1);
    }

    .phrase {
      font-family: "Playfair Display", serif;
      font-size: clamp(1.15rem, 4.4vw, 1.75rem);
      line-height: 1.5;
      font-weight: 400;
      margin: 6px auto 8px;
      max-width: 34ch;
      text-wrap: balance;
    }

    .phrase em {
      font-style: italic;
      background: linear-gradient(90deg, #ff9ecf, #f6c453, #c39bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .since {
      font-size: clamp(0.72rem, 2.8vw, 0.85rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 18px 0 14px;
    }

    /* Cuadrícula mobile-first: 6 columnas
       → Meses y Días ocupan 3 cada uno (fila superior)
       → Horas, Minutos y Segundos ocupan 2 cada uno (fila inferior) */
    .counter {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .card { grid-column: span 2; }
    .card.big { grid-column: span 3; }

    .card {
      min-width: 0;
      padding: 14px 6px 12px;
      border-radius: 18px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .num {
      display: block;
      font-family: "Playfair Display", serif;
      font-weight: 600;
      font-size: clamp(1.7rem, 8vw, 2.6rem);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 4px;
      font-size: clamp(0.62rem, 2.6vw, 0.75rem);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Tablet / escritorio: las 5 tarjetas en una sola fila */
    @media (min-width: 640px) {
      .counter {
        grid-template-columns: repeat(5, 1fr);
        max-width: 640px;
        gap: 14px;
      }
      .card, .card.big { grid-column: span 1; }
      .card { padding: 18px 8px 14px; }
    }

    /* Accesibilidad: menos movimiento si el usuario lo prefiere */
    @media (prefers-reduced-motion: reduce) {
      .heart-btn, .hint, .alive .head { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Partículas / destellos ambientales -->
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- ============ PANTALLA INICIAL ============ -->
  <section id="intro">
    <button class="heart-btn" id="heart" aria-label="Toca el corazón">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="heartFill" cx="38%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#ff9cc2" />
            <stop offset="55%" stop-color="#ff4d8d" />
            <stop offset="100%" stop-color="#c2185b" />
          </radialGradient>
        </defs>
        <path fill="url(#heartFill)"
              d="M50 88 C22 68 6 50 10 31 C14 14 36 10 50 28 C64 10 86 14 90 31 C94 50 78 68 50 88 Z" />
        <!-- reflejo de luz -->
        <ellipse cx="32" cy="30" rx="9" ry="5" fill="#fff" opacity="0.35" transform="rotate(-30 32 30)" />
      </svg>
    </button>
    <p class="hint">Toca el corazón</p>
  </section>

  <!-- ============ ESCENA DE LA FLOR ============ -->
  <main id="scene" aria-live="polite">
    <!-- El contenido de la flor (pétalos) se genera con JavaScript -->
    <svg id="flower" viewBox="0 0 400 520" aria-label="Una flor con pétalos en forma de corazón">
      <defs id="defs"></defs>

      <!-- Tallo -->
      <path class="stem" pathLength="1" fill="none" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round"
            d="M200 512 C 188 440, 214 380, 200 320 C 190 276, 204 236, 200 200" />

      <!-- Hojas (forma de lágrima), ancladas al tallo -->
      <g transform="translate(197 405)">
        <path class="leaf" style="--r:-125deg; --d:0.55s; --s:1"
              fill="url(#leafGrad)" d="M0 0 C 14 -14, 18 -42, 0 -62 C -18 -42, -14 -14, 0 0 Z" />
      </g>
      <g transform="translate(203 330)">
        <path class="leaf" style="--r:125deg; --d:0.8s; --s:0.85"
              fill="url(#leafGrad)" d="M0 0 C 14 -14, 18 -42, 0 -62 C -18 -42, -14 -14, 0 0 Z" />
      </g>

      <!-- Cabeza de la flor: centro en (200,195) -->
      <g transform="translate(200 195)">
        <g class="head" id="head"></g>
      </g>
    </svg>

    <!-- Frase + contador -->
    <section id="message">
      <p class="phrase">
       Si pudiera elegir un lugar seguro,
       seria a tu lado. Cuanto más tiempo estoy contigo más te amo.
      </p>

      <p class="since">Mi amor por ti comenzó hace...</p>

      <div class="counter" role="timer" aria-label="Tiempo juntos">
        <div class="card big"><span class="num" id="months">0</span><span class="label">Meses</span></div>
        <div class="card big"><span class="num" id="days">0</span><span class="label">Días</span></div>
        <div class="card"><span class="num" id="hours">00</span><span class="label">Horas</span></div>
        <div class="card"><span class="num" id="minutes">00</span><span class="label">Minutos</span></div>
        <div class="card"><span class="num" id="seconds">00</span><span class="label">Segundos</span></div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    /* =========================================================
       A. CIELO AMBIENTAL (canvas con destellos que titilan)
       ========================================================= */
    (function sky() {
      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let w, h, dpr, stars = [];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Densidad proporcional al área de pantalla
        const count = Math.round((w * h) / 9000);
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.3 + 0.3,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.02 + 0.006,
          drift: Math.random() * 0.12 + 0.02,
          hue: Math.random() < 0.3 ? 330 : (Math.random() < 0.5 ? 45 : 260)
        }));
      }

      function frame() {
        ctx.clearRect(0, 0, w, h);
        for (const s of stars) {
          s.phase += s.speed;
          s.y -= s.drift;                         // ascienden lentamente
          if (s.y < -5) { s.y = h + 5; s.x = Math.random() * w; }
          const a = 0.25 + 0.6 * (0.5 + 0.5 * Math.sin(s.phase));
          ctx.beginPath();
          ctx.fillStyle = `hsla(${s.hue}, 90%, 85%, ${a})`;
          ctx.shadowColor = `hsla(${s.hue}, 90%, 70%, ${a})`;
          ctx.shadowBlur = 6;
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        if (!reduce) requestAnimationFrame(frame);
      }

      resize();
      window.addEventListener("resize", resize);
      frame();
    })();

    /* =========================================================
       B. CONSTRUCCIÓN DE LA FLOR (SVG generado)
       ========================================================= */
    const SVG_NS = "http://www.w3.org/2000/svg";

    /* Pétalo con forma de corazón.
       La punta del corazón está en (0,0) = centro de la flor,
       y los dos lóbulos se abren hacia afuera (eje -Y). */
    const HEART_PETAL =
      "M0 0 C -20 -12, -34 -30, -28 -48 C -23 -62, -6 -64, 0 -50 " +
      "C 6 -64, 23 -62, 28 -48 C 34 -30, 20 -12, 0 0 Z";

    // Colores armónicos: rosas, corales, lavandas, dorados y magentas
    const INNER_COLORS = ["#ffc2d9", "#ffd38a", "#e3c4ff", "#ffb4a2", "#ff9ecf", "#f7c6ff"];
    const OUTER_COLORS = ["#ff5fa2", "#ff8a7a", "#b48cff", "#f6c453", "#e0458f", "#ff9e8b", "#9f7aff", "#ff77b4"];

    const defs = document.getElementById("defs");
    const head = document.getElementById("head");

    function el(tag, attrs = {}, parent) {
      const node = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(node);
      return node;
    }

    // Degradados del tallo y las hojas
    (function baseGradients() {
      const sg = el("linearGradient", { id: "stemGrad", x1: "0", y1: "1", x2: "0", y2: "0" }, defs);
      el("stop", { offset: "0%", "stop-color": "#1f6b4a" }, sg);
      el("stop", { offset: "100%", "stop-color": "#7fd6a0" }, sg);

      const lg = el("linearGradient", { id: "leafGrad", x1: "0", y1: "0", x2: "0", y2: "-62", gradientUnits: "userSpaceOnUse" }, defs);
      el("stop", { offset: "0%", "stop-color": "#2e8b5f" }, lg);
      el("stop", { offset: "100%", "stop-color": "#9be7b6", "stop-opacity": "0.85" }, lg);

      const cg = el("radialGradient", { id: "coreGrad", cx: "40%", cy: "35%", r: "70%" }, defs);
      el("stop", { offset: "0%", "stop-color": "#fff6d6" }, cg);
      el("stop", { offset: "60%", "stop-color": "#f6c453" }, cg);
      el("stop", { offset: "100%", "stop-color": "#d98b2b" }, cg);
    })();

    // Un degradado por color: intenso en la base, luminoso y translúcido en la punta
    function petalGradient(color, i, ring) {
      const id = `pg-${ring}-${i}`;
      const g = el("linearGradient", { id, x1: "0", y1: "0", x2: "0", y2: "-62", gradientUnits: "userSpaceOnUse" }, defs);
      el("stop", { offset: "0%",   "stop-color": color, "stop-opacity": "1" }, g);
      el("stop", { offset: "65%",  "stop-color": color, "stop-opacity": "0.82" }, g);
      el("stop", { offset: "100%", "stop-color": "#ffffff", "stop-opacity": "0.55" }, g);
      return id;
    }

    function addPetal(parent, { color, angle, scale, delay, ring, i }) {
      const gid = petalGradient(color, i, ring);
      const g = el("g", { class: "petal" }, parent);
      g.style.setProperty("--r", angle + "deg");
      g.style.setProperty("--s", scale);
      g.style.setProperty("--d", delay + "s");
      g.style.setProperty("--dur", "0.85s");
      el("path", { d: HEART_PETAL, fill: `url(#${gid})`, stroke: "rgba(255,255,255,0.35)", "stroke-width": "0.8" }, g);
      // vena central sutil
      el("path", { d: "M0 -4 L0 -40", stroke: "rgba(255,255,255,0.28)", "stroke-width": "1", "stroke-linecap": "round", fill: "none" }, g);
    }

    /* Coreografía (desde el inicio del florecimiento):
       0.00s – 1.10s  tallo se dibuja
       0.55s – 1.60s  hojas
       1.05s          aparece el botón central
       1.15s – 2.10s  anillo interior (6 pétalos, uno a uno)
       1.85s – 3.15s  anillo exterior (8 pétalos, uno a uno)
       ≈ 3.2s         flor completa → aparece el mensaje                 */
    const BLOOM_TOTAL_MS = 3250;

    // Anillo exterior (se dibuja primero en el DOM para quedar debajo)
    const outer = el("g", {}, head);
    OUTER_COLORS.forEach((color, i) => {
      addPetal(outer, { color, i, ring: "o", angle: i * 45 + 22.5, scale: 2.0, delay: 1.85 + i * 0.075 });
    });

    // Anillo interior
    const inner = el("g", {}, head);
    INNER_COLORS.forEach((color, i) => {
      addPetal(inner, { color, i, ring: "i", angle: i * 60, scale: 1.25, delay: 1.15 + i * 0.1 });
    });

    // Centro de la flor (botón con pequeños estambres)
    const core = el("g", { class: "core" }, head);
    core.style.setProperty("--d", "1.05s");
    core.style.setProperty("--dur", "0.7s");
    el("circle", { r: "20", fill: "url(#coreGrad)" }, core);
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      const rr = k % 2 ? 7 : 11;
      el("circle", { cx: (Math.cos(a) * rr).toFixed(2), cy: (Math.sin(a) * rr).toFixed(2), r: "1.6", fill: "#fff3c4", opacity: "0.9" }, core);
    }

    /* =========================================================
       C. CONTADOR EXACTO (calendario real)
       ========================================================= */
    // 11 de enero de 2026, 00:45:00 en la hora local del dispositivo
    const START = new Date(2026, 0, 11, 0, 45, 0);

    // Suma meses respetando el calendario (si el día no existe, usa el último del mes)
    function addMonths(date, n) {
      const d = new Date(date.getTime());
      const day = d.getDate();
      d.setDate(1);
      d.setMonth(d.getMonth() + n);
      const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, lastDay));
      return d;
    }

    // Suma días de calendario (respeta cambios de horario de verano)
    function addDays(date, n) {
      const d = new Date(date.getTime());
      d.setDate(d.getDate() + n);
      return d;
    }

    function elapsed(from, to) {
      if (to < from) return { months: 0, days: 0, hours: 0, minutes: 0, seconds: 0 };

      // 1) Meses completos
      let months = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
      if (addMonths(from, months) > to) months--;
      const afterMonths = addMonths(from, months);

      // 2) Días completos desde ese punto
      let days = 0;
      while (addDays(afterMonths, days + 1) <= to) days++;
      const afterDays = addDays(afterMonths, days);

      // 3) Resto en horas, minutos y segundos
      let rest = Math.floor((to - afterDays) / 1000);
      const hours = Math.floor(rest / 3600); rest %= 3600;
      const minutes = Math.floor(rest / 60);
      const seconds = rest % 60;

      return { months, days, hours, minutes, seconds };
    }

    const $ = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, "0");

    function tick() {
      const t = elapsed(START, new Date());
      $("months").textContent = t.months;
      $("days").textContent = t.days;
      $("hours").textContent = pad(t.hours);
      $("minutes").textContent = pad(t.minutes);
      $("seconds").textContent = pad(t.seconds);
    }

    // Sincroniza con el cambio exacto de segundo del reloj
    function startCounter() {
      tick();
      setTimeout(function loop() {
        tick();
        setTimeout(loop, 1000 - (Date.now() % 1000) + 5);
      }, 1000 - (Date.now() % 1000) + 5);
    }

    /* =========================================================
       D. SECUENCIA INTERACTIVA
       ========================================================= */
    const heartBtn = $("heart");
    const intro = $("intro");
    const scene = $("scene");
    const flower = $("flower");
    const message = $("message");
    let started = false;

    function burst(x, y) {
      const colors = ["#ff9ecf", "#f6c453", "#c39bff", "#ff8a7a", "#ffffff"];
      for (let i = 0; i < 22; i++) {
        const s = document.createElement("span");
        s.className = "spark";
        const a = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 110;
        s.style.left = x + "px";
        s.style.top = y + "px";
        s.style.background = colors[i % colors.length];
        s.style.boxShadow = `0 0 10px ${colors[i % colors.length]}`;
        s.style.setProperty("--dx", Math.cos(a) * dist + "px");
        s.style.setProperty("--dy", Math.sin(a) * dist + "px");
        document.body.appendChild(s);
        s.addEventListener("animationend", () => s.remove());
      }
    }

    function start() {
      if (started) return;
      started = true;

      const r = heartBtn.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
      heartBtn.classList.add("leaving");

      // El corazón se desvanece y da paso a la flor
      setTimeout(() => {
        intro.classList.add("gone");
        scene.classList.add("active");
        startCounter();
        // doble rAF: garantiza que el display:flex se aplique antes de animar
        requestAnimationFrame(() => requestAnimationFrame(() => flower.classList.add("bloom")));

        // Cuando la flor termina de abrirse: mensaje + respiración
        setTimeout(() => {
          message.classList.add("show");
          flower.classList.add("alive");
        }, BLOOM_TOTAL_MS);

        setTimeout(() => intro.remove(), 900);
      }, 550);
    }

    heartBtn.addEventListener("click", start);
  </script>
</body>
</html>
